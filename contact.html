<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Myrto Pavlopoulou</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 400;
    }

    a {
      text-decoration: none;
    }

    header {
      position: relative;
      height: 12vh;
      min-height: 70px;
      padding: 30px 3vw 0 3vw;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      font-size: 10px;
      text-transform: uppercase;
    }

    .name {
      text-align: left;
      color: #000000;
    }

    .profession {
      text-align: right;
      color: #000000;
    }

    .navigation {
      position: absolute;
      left: 3vw;
      bottom: 0;
      display: flex;
      gap: 25px;
      font-size: 10px;
      text-transform: uppercase;
    }

    .navigation a {
      color: #777777;
      font-size: 10px;
      transition: color 0.25s ease;
    }

    .navigation a:hover {
      color: #000000;
    }

    .navigation .active {
      color: #2f6fff;
    }

    main {
      height: 76vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8vw;
    }

    .contact {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 18px;
      text-align: right;
      font-size: 10px;
    }

    .profile-image {
      width: 90px;
      height: 90px;
      object-fit: cover;
      display: block;
      margin-bottom: 8px;
    }

    .contact a,
    .contact span {
      color: #777777;
      font-size: 10px;
    }

    .contact a {
      transition: color 0.25s ease;
    }

    .contact a:hover {
      color: #000000;
    }

    @media (max-width: 650px) {

      html,
      body {
        height: auto;
      }

      header {
        height: auto;
        padding: 24px 5vw 0 5vw;
      }

      .navigation {
        position: static;
        margin-top: 45px;
        gap: 20px;
      }

      main {
        height: auto;
        min-height: 70vh;
        padding: 70px 8vw;
        justify-content: flex-end;
      }

      .profile-image {
        width: 80px;
        height: 80px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="name">MYRTO PAVLOPOULOU</div>

<div class="profession">
  <a href="index.html">MYRTO PAVLOPOULOY</a>
</div>

    <nav class="navigation">
      <a href="gallery.html">GALLERY</a>
      <a href="contact.html" class="active">CONTACT</a>
    </nav>
  </header>

  <main>
    <div class="contact">

      <img
        src="profile.jpg"
        alt="Myrto Pavlopoulou"
        class="profile-image"
      >

      <a href="mailto:myrtopav@gmail.com">
        myrtopav@gmail.com
      </a>

      <a
        href="https://www.instagram.com/myyrto/"
        target="_blank"
        rel="noopener noreferrer"
      >
        @myyrto
      </a>

      <span>
        Athens, Greece
      </span>

    </div>
  </main>

</body>
</html>
