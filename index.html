<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Myrto Pavlopoulou — Architect</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 400;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    header {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: start;

      padding: 30px 3vw 0 3vw;

      font-size: 13px;
      letter-spacing: 0.02em;
    }

    .name {
      text-transform: uppercase;
    }

    .profession {
      text-align: right;
      text-transform: uppercase;
    }

    .navigation {
      position: absolute;
      left: 3vw;
      top: 115px;

      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .navigation a {
      color: #777;
      font-size: 12px;
      text-transform: uppercase;
      transition: color 0.25s ease;
    }

    .navigation a:hover {
      color: #111;
    }

    /* GALLERY */

    .selected-work {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 2.5vw;

      padding: 105px 3vw 55px 3vw;
    }

    .project {
      display: block;
    }

    .project-image {
      width: 100%;
      aspect-ratio: 5 / 6;

      object-fit: cover;

      display: block;

      transition:
        transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1),
        opacity 0.5s ease;
    }

    .project:hover .project-image {
      transform: scale(1.025);
      opacity: 0.9;
    }

    /* FOOTER */

    footer {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;

      padding: 80px 3vw 35px 3vw;

      font-size: 12px;
      text-transform: uppercase;
    }

    footer .center {
      text-align: center;
    }

    footer .right {
      text-align: right;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      header {
        grid-template-columns: 1fr 1fr;

        padding: 24px 5vw 0 5vw;
      }

      .profession {
        text-align: right;
      }

      .navigation {
        position: static;

        grid-column: 1 / -1;

        flex-direction: row;

        gap: 22px;

        margin-top: 55px;
      }

      .selected-work {
        grid-template-columns: repeat(2, 1fr);

        gap: 5vw;

        padding: 80px 5vw 80px 5vw;
      }

      .project-image {
        aspect-ratio: 4 / 5;
      }

      footer {
        grid-template-columns: 1fr;

        gap: 15px;

        padding: 50px 5vw 30px 5vw;
      }

      footer .center,
      footer .right {
        text-align: left;
      }
    }

    @media (max-width: 500px) {

      header {
        font-size: 11px;
      }

      .navigation {
        margin-top: 45px;
      }

      .selected-work {
        grid-template-columns: 1fr;

        gap: 45px;

        padding-top: 65px;
      }

      .project-image {
        aspect-ratio: 4 / 5;
      }
    }

  </style>
</head>

<body>

  <header>

    <div class="name">
      MYRTO PAVLOPOULOU
    </div>

    <div></div>

    <div class="profession">
      ARCHITECT
    </div>

    <nav class="navigation">
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>

  </header>


  <main>

    <section class="selected-work">

      <a href="project1.html" class="project">
        <img
          class="project-image"
          src="https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=1000&q=80"
          alt="Project 1">
      </a>

      <a href="project2.html" class="project">
        <img
          class="project-image"
          src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=1000&q=80"
          alt="Project 2">
      </a>

      <a href="project3.html" class="project">
        <img
          class="project-image"
          src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1000&q=80"
          alt="Project 3">
      </a>

      <a href="project4.html" class="project">
        <img
          class="project-image"
          src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1000&q=80"
          alt="Project 4">
      </a>

    </section>

  </main>


  <footer>

    <div>
      Athens, Greece
    </div>

    <div class="center">
      Myrto Pav
    </div>

    <div class="right">
      Instagram
    </div>

  </footer>

</body>
</html>
