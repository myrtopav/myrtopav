<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gallery — Myrto Pavlopoulou</title>

  <link rel="icon" type="image/jpeg" href="profile.jpg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 400;
      cursor: url("cursor2.png") 25 25, auto;
    }

    a,
    button {
      cursor: url("cursor2.png") 25 25, auto;
    }

    a {
      text-decoration: none;
    }

    button {
      border: none;
      background: none;
      font-family: inherit;
    }

    /* HEADER */

    header {
      position: relative;
      height: 12vh;
      min-height: 70px;
      padding: 30px 3vw 0 3vw;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      font-size: 10px;
      text-transform: uppercase;
    }

    .name {
      text-align: left;
    }

    .name a {
      color: #777777;
      font-size: 10px;
      transition: color 0.2s ease;
    }

    .name a:hover {
      color: #2f6fff;
    }

    .profession {
      text-align: right;
      color: #777777;
    }

    .navigation {
      position: absolute;
      left: 3vw;
      bottom: 0;
      display: flex;
      gap: 25px;
    }

    .navigation a {
      color: #777777;
      font-size: 10px;
      transition: color 0.2s ease;
    }

    .navigation a:hover {
      color: #2f6fff;
    }

    .navigation .active {
      color: #000000;
    }

    .navigation .active:hover {
      color: #2f6fff;
    }

    /* GALLERY */

    main {
      width: 100%;
      padding: 70px 7vw 100px 7vw;
    }

    .gallery-grid {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7vw;
      align-items: start;
    }

    /* PROJECT */

    .project {
      width: 100%;
      text-align: center;
    }

    .image-area {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .project-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 58vh;
      object-fit: contain;
      transition:
        opacity 0.35s ease,
        transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .image-area:hover .project-image {
      transform: scale(1.025);
    }

    /* ARROWS */

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #777777;
      font-size: 15px;
      font-weight: 400;

      opacity: 0;
      transition:
        opacity 0.25s ease,
        color 0.2s ease;
    }

    .arrow-left {
      left: -48px;
    }

    .arrow-right {
      right: -48px;
    }

    .image-area:hover .arrow {
      opacity: 1;
    }

    .arrow:hover {
      color: #2f6fff;
    }

    /* PROJECT INFORMATION */

    .project-info {
      display: flex;
      flex-direction: column;
      align-items: center;

      margin-top: 16px;

      color: #2f6fff;
    }

    .project-line {
      width: 22px;
      height: 1px;
      background: #2f6fff;
      margin-bottom: 9px;
    }

    .project-title {
      color: #2f6fff;
      font-size: 10px;
      line-height: 1.4;
      text-transform: uppercase;
      text-align: center;
    }

    /* CREDIT */

    .website-credit {
      position: fixed;
      right: 3vw;
      bottom: 25px;

      color: #777777;
      font-size: 10px;
      font-weight: 400;
      text-align: right;
    }

    /* TABLET */

    @media (max-width: 1000px) {

      .gallery-grid {
        grid-template-columns: 1fr 1fr;
        gap: 80px 8vw;
      }

      main {
        padding-left: 8vw;
        padding-right: 8vw;
      }

      .arrow-left {
        left: -38px;
      }

      .arrow-right {
        right: -38px;
      }

    }

    /* MOBILE */

    @media (max-width: 650px) {

      html,
      body {
        height: auto;
      }

      header {
        height: auto;
        padding: 24px 5vw 0 5vw;
      }

      .navigation {
        position: static;
        margin-top: 45px;
        gap: 20px;
      }

      main {
        padding: 70px 10vw 80px 10vw;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
        gap: 80px;
      }

      .project-image {
        max-height: none;
      }

      .arrow {
        opacity: 1;
      }

      .arrow-left {
        left: -45px;
      }

      .arrow-right {
        right: -45px;
      }

      .website-credit {
        right: 5vw;
        bottom: 20px;
      }

    }

    @media (max-width: 450px) {

      main {
        padding-left: 12vw;
        padding-right: 12vw;
      }

      .gallery-grid {
        gap: 70px;
      }

      .arrow-left {
        left: -42px;
      }

      .arrow-right {
        right: -42px;
      }

      .website-credit {
        font-size: 9px;
      }

    }

  </style>
</head>

<body>

  <header>

    <div class="name">
      <a href="index.html">MYRTO PAVLOPOULOU</a>
    </div>

    <div class="profession">
      ARCHITECT
    </div>

    <nav class="navigation">
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </nav>

  </header>


  <main>

    <section class="gallery-grid">


      <!-- =====================================================
           JELLY
           ===================================================== -->

      <article class="project">

        <div class="image-area">

          <button
            class="arrow arrow-left"
            type="button"
            aria-label="Previous Jelly image"
          >
            ←
          </button>

          <img
            class="project-image"
            src="Jelly_1.jpg"
            alt="Echoes of the Deep"
            data-project="jelly"
          >

          <button
            class="arrow arrow-right"
            type="button"
            aria-label="Next Jelly image"
          >
            →
          </button>

        </div>

        <div class="project-info">

          <div class="project-line"></div>

          <div class="project-title">
            ECHOES OF THE DEEP
          </div>

        </div>

      </article>


      <!-- =====================================================
           SMITHSON
           ===================================================== -->

      <article class="project">

        <div class="image-area">

          <button
            class="arrow arrow-left"
            type="button"
            aria-label="Previous Smithson image"
          >
            ←
          </button>

          <img
            class="project-image"
            src="Smithson_1.png"
            alt="Places inspired by Robert Smithson"
            data-project="smithson"
          >

          <button
            class="arrow arrow-right"
            type="button"
            aria-label="Next Smithson image"
          >
            →
          </button>

        </div>

        <div class="project-info">

          <div class="project-line"></div>

          <div class="project-title">
            PLACES INSPIRED BY ROBERT SMITHSON
          </div>

        </div>

      </article>


      <!-- =====================================================
           VETCARD
           ===================================================== -->

      <article class="project">

        <div class="image-area">

          <button
            class="arrow arrow-left"
            type="button"
            aria-label="Previous VetCard image"
          >
            ←
          </button>

          <img
            class="project-image"
            src="VetCard_1.jpg"
            alt="VetCard"
            data-project="vetcard"
          >

          <button
            class="arrow arrow-right"
            type="button"
            aria-label="Next VetCard image"
          >
            →
          </button>

        </div>

        <div class="project-info">

          <div class="project-line"></div>

          <div class="project-title">
            VETCARD
          </div>

        </div>

      </article>


    </section>

  </main>


  <div class="website-credit">
    WEB DESIGN: MYRTO PAVLOPOULOU
  </div>


  <script>

    /* =====================================================
       PROJECT IMAGE LISTS
       ===================================================== */

    const projects = {

      jelly: [
        "Jelly_1.jpg",
        "Jelly_2.JPG",
        "Jelly_3.JPG",
        "Jelly_4.jpg",
        "Jelly_5.JPG",
        "Jelly_6.jpg",
        "Jelly_7.JPG",
        "Jelly_8.JPG"
      ],

      smithson: [
        "Smithson_1.png",
        "Smithson_2.jpg",
        "Smithson_3.png",
        "Smithson_4.png",
        "Smithson_5.jpg",
        "Smithson_6.jpg",
        "Smithson_7.jpg",
        "Smithson_8.jpg",
        "Smithson_9.png",
        "Smithson_10.png"
      ],

      vetcard: [
        "VetCard_1.jpg",
        "VetCard2.jpg"
      ]

    };


    /* =====================================================
       SLIDESHOW
       ===================================================== */

    document.querySelectorAll(".project").forEach(function(project) {

      const image = project.querySelector(".project-image");
      const leftButton = project.querySelector(".arrow-left");
      const rightButton = project.querySelector(".arrow-right");

      const projectName = image.dataset.project;
      const images = projects[projectName];

      let currentIndex = 0;


      function showImage(index) {

        currentIndex = (index + images.length) % images.length;

        image.style.opacity = "0";

        setTimeout(function() {

          image.src = images[currentIndex];

          image.onload = function() {
            image.style.opacity = "1";
          };

        }, 150);

      }


      leftButton.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        showImage(currentIndex - 1);

      });


      rightButton.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        showImage(currentIndex + 1);

      });


      /* Keyboard navigation when mouse is over project */

      project.addEventListener("mouseenter", function() {

        project.dataset.active = "true";

      });


      project.addEventListener("mouseleave", function() {

        project.dataset.active = "false";

      });

    });


    /* =====================================================
       KEYBOARD ARROWS
       ===================================================== */

    document.addEventListener("keydown", function(event) {

      const activeProject = document.querySelector(
        '.project[data-active="true"]'
      );

      if (!activeProject) {
        return;
      }

      const image = activeProject.querySelector(".project-image");
      const projectName = image.dataset.project;
      const images = projects[projectName];

      let currentIndex = images.indexOf(image.src.split("/").pop());

      if (currentIndex === -1) {
        currentIndex = 0;
      }

      if (event.key === "ArrowLeft") {

        event.preventDefault();

        currentIndex =
          (currentIndex - 1 + images.length) % images.length;

        image.style.opacity = "0";

        setTimeout(function() {

          image.src = images[currentIndex];

          image.onload = function() {
            image.style.opacity = "1";
          };

        }, 150);

      }

      if (event.key === "ArrowRight") {

        event.preventDefault();

        currentIndex =
          (currentIndex + 1) % images.length;

        image.style.opacity = "0";

        setTimeout(function() {

          image.src = images[currentIndex];

          image.onload = function() {
            image.style.opacity = "1";
          };

        }, 150);

      }

    });

  </script>

</body>

</html>
