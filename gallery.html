<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gallery — Myrto Pavlopoulou</title>

  <link
    rel="icon"
    type="image/jpeg"
    href="profile.jpg"
  >


  <style>

    /* =========================================
       BASIC
       ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {

      background: #f2f6ff;

      color: #000000;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 10px;

      font-weight: 400;

      cursor:
        url("cursor2.png") 25 25,
        auto;
    }

    a {

      text-decoration: none;

      cursor:
        url("cursor2.png") 25 25,
        auto;
    }


    /* =========================================
       HEADER
       ========================================= */

    header {

      position: relative;

      height: 15vh;

      min-height: 90px;

      padding:
        30px
        3vw
        0
        3vw;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      align-items: start;

      font-size: 10px;

      text-transform: uppercase;
    }


    .name {

      text-align: left;
    }


    .name a {

      color: #777777;

      font-size: 10px;

      transition:
        color 0.2s ease;
    }


    .name a:hover {

      color: #2f6fff;
    }


    .profession {

      text-align: right;

      color: #777777;
    }


    /* =========================================
       NAVIGATION
       ========================================= */

    .navigation {

      position: absolute;

      left: 3vw;

      bottom: 0;

      display: flex;

      gap: 25px;

      font-size: 10px;

      text-transform: uppercase;
    }


    .navigation a {

      color: #777777;

      font-size: 10px;

      transition:
        color 0.2s ease;
    }


    .navigation a:hover {

      color: #2f6fff;
    }


    /* =========================================
       EDITORIAL GALLERY
       ========================================= */

    main {

      width: 100%;

      padding:
        5vh
        3vw
        120px
        3vw;
    }


    .gallery {

      position: relative;

      width: 100%;

      min-height: 125vh;
    }


    /* =========================================
       PROJECT
       ========================================= */

    .project {

      position: absolute;

      text-align: center;
    }


    /* =========================================
       DIFFERENT PROJECT POSITIONS / SIZES
       ========================================= */

    /*
      ECHOES OF THE DEEP
      small / upper left
    */

    .project-jelly {

      width: 29vw;

      left: 1vw;

      top: 1vh;
    }


    /*
      ROBERT SMITHSON
      larger / upper right
    */

    .project-smithson {

      width: 34vw;

      right: 3vw;

      top: 0;
    }


    /*
      VETCARD
      smaller / middle left
    */

    .project-vetcard {

      width: 25vw;

      left: 25vw;

      top: 43vh;
    }


    /*
      URBAN DESIGN
      medium / middle right
    */

    .project-urban {

      width: 29vw;

      right: 15vw;

      top: 48vh;
    }


    /* =========================================
       IMAGE AREA
       ========================================= */

    .image-area {

      position: relative;

      width: 100%;

      margin: 0 auto;

      overflow: visible;
    }


    .project-image {

      display: block;

      width: 100%;

      height: auto;

      object-fit: contain;

      transition:
        transform 0.5s
        cubic-bezier(
          0.2,
          0.7,
          0.2,
          1
        ),

        opacity 0.4s ease;
    }


    /*
      Slight enlargement on hover
    */

    .project:hover .project-image {

      transform:
        scale(1.045);

      opacity: 0.92;
    }


    /* =========================================
       ARROWS
       ========================================= */

    .arrow {

      position: absolute;

      top: 50%;

      transform:
        translateY(-50%);

      z-index: 10;

      border: none;

      outline: none;

      padding: 0;

      background: transparent;

      color: #777777;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 17px;

      line-height: 1;

      cursor:
        url("cursor2.png") 25 25,
        auto;

      opacity: 0;

      transition:
        opacity 0.25s ease,
        color 0.2s ease;
    }


    .arrow-left {

      left: 12px;
    }


    .arrow-right {

      right: 12px;
    }


    .project:hover .arrow {

      opacity: 1;
    }


    .arrow:hover {

      color: #2f6fff;
    }


    /* =========================================
       PROJECT INFORMATION
       ========================================= */

    .project-info {

      display: flex;

      flex-direction: column;

      align-items: center;

      margin-top: 13px;

      opacity: 0;

      transform:
        translateY(-5px);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;

      pointer-events: none;
    }


    .project:hover .project-info {

      opacity: 1;

      transform:
        translateY(0);
    }


    .project-line {

      width: 22px;

      height: 1px;

      background: #2f6fff;

      margin-bottom: 8px;
    }


    .project-title {

      color: #2f6fff;

      font-size: 10px;

      line-height: 1.35;

      text-transform: uppercase;
    }


    .project-description {

      max-width: 280px;

      margin-top: 7px;

      color: #777777;

      font-size: 9px;

      line-height: 1.5;

      text-transform: none;
    }


    .black-text {

      color: #000000;
    }


    .project-description a {

      color: #777777;

      text-decoration: none;

      transition:
        color 0.2s ease;
    }


    .project-description a:hover {

      color: #2f6fff;
    }


    .location {

      display: block;

      margin-top: 1px;
    }


    /* =========================================
       WEBSITE CREDIT
       ========================================= */

    .website-credit {

      position: fixed;

      right: 3vw;

      bottom: 25px;

      color: #777777;

      font-size: 10px;

      font-weight: 400;

      text-align: right;

      z-index: 50;
    }


    /* =========================================
       TABLET
       ========================================= */

    @media (max-width: 900px) {

      header {

        padding-left: 5vw;

        padding-right: 5vw;
      }


      .navigation {

        left: 5vw;
      }


      main {

        padding-left: 5vw;

        padding-right: 5vw;
      }


      .gallery {

        min-height: 110vh;
      }


      .project-jelly {

        width: 31vw;

        left: 0;

        top: 2vh;
      }


      .project-smithson {

        width: 37vw;

        right: 1vw;

        top: 0;
      }


      .project-vetcard {

        width: 28vw;

        left: 21vw;

        top: 42vh;
      }


      .project-urban {

        width: 32vw;

        right: 8vw;

        top: 48vh;
      }

    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 650px) {

      html,
      body {

        height: auto;
      }


      header {

        height: auto;

        padding:
          24px
          5vw
          0
          5vw;
      }


      .navigation {

        position: static;

        margin-top: 45px;

        gap: 20px;
      }


      main {

        padding:
          65px
          7vw
          100px
          7vw;
      }


      .gallery {

        min-height: auto;

        display: flex;

        flex-direction: column;

        gap: 70px;
      }


      .project {

        position: relative;

        width: 72% !important;

        left: auto !important;

        right: auto !important;

        top: auto !important;

        margin: 0 auto;
      }


      /*
        Slight variation in mobile
        positioning so everything
        does not look identical.
      */

      .project:nth-child(2) {

        width: 82% !important;

        margin-left: 12%;
      }


      .project:nth-child(3) {

        width: 62% !important;

        margin-left: 5%;
      }


      .project:nth-child(4) {

        width: 72% !important;

        margin-right: 5%;
      }


      .project-info {

        opacity: 1;

        transform:
          translateY(0);

        pointer-events: auto;
      }


      .arrow {

        opacity: 1;

        font-size: 16px;
      }


      .website-credit {

        right: 5vw;

        bottom: 20px;
      }

    }


    /* =========================================
       SMALL MOBILE
       ========================================= */

    @media (max-width: 450px) {

      main {

        padding-left: 8vw;

        padding-right: 8vw;
      }


      .gallery {

        gap: 60px;
      }


      .project {

        width: 78% !important;
      }


      .project:nth-child(2) {

        width: 88% !important;

        margin-left: 8%;
      }


      .project:nth-child(3) {

        width: 68% !important;

        margin-left: 2%;
      }


      .project:nth-child(4) {

        width: 76% !important;

        margin-right: 2%;
      }


      .project-description {

        font-size: 9px;
      }


      .website-credit {

        font-size: 9px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       HEADER
       ========================================= -->

  <header>


    <div class="name">

      <a href="index.html">
        MYRTO PAVLOPOULOU
      </a>

    </div>


    <div class="profession">
      ARCHITECT
    </div>


    <nav class="navigation">

      <a href="about.html">
        ABOUT
      </a>

      <a href="contact.html">
        CONTACT
      </a>

    </nav>


  </header>



  <!-- =========================================
       GALLERY
       ========================================= -->

  <main>


    <section class="gallery">


      <!-- =====================================
           ECHOES OF THE DEEP
           ===================================== -->

      <article
        class="project project-jelly"
      >


        <div
          class="image-area"
          onclick="nextImage(0)"
        >


          <button
            class="arrow arrow-left"
            type="button"
            onclick="event.stopPropagation(); previousImage(0)"

          >

          </button>


          <img
            id="image-0"

            src="Jelly_1.jpg"
            alt="Echoes of the Deep"
          >


          <button
            class="arrow arrow-right"
            type="button"
            onclick="event.stopPropagation(); nextImage(0)"
            aria-label="Next image"
          >
            →
          </button>


        </div>


        <div class="project-info">


          <div class="project-line"></div>


          <div class="project-title">
            ECHOES OF THE DEEP
          </div>


          <div class="project-description">

            an interactive
            <span class="black-text">
              light and sound installation
            </span>
            for Mar Motto festival’s 2025 edition with

            <a
              href="https://moradavaga.com/ECHOES-OF-THE-DEEP"
              target="_blank"
              rel="noopener noreferrer"
              onclick="event.stopPropagation()"
            >
              MORADAVAGA
            </a>

            <span class="location">
              Faro, Portugal
            </span>

          </div>


        </div>


      </article>



      <!-- =====================================
           ROBERT SMITHSON
           ===================================== -->

      <article

      >


        <div
          class="image-area"
          onclick="nextImage(1)"
        >


          <button
            class="arrow arrow-left"
            type="button"
            onclick="event.stopPropagation(); previousImage(1)"
            aria-label="Previous image"
          >
            ←
          </button>


          <img
            id="image-1"
            class="project-image"
            src="Smithson_1.png"
            alt="Places inspired by Robert Smithson"
          >


          <button
            class="arrow arrow-right"
            type="button"
            onclick="event.stopPropagation(); nextImage(1)"
            aria-label="Next image"
          >
            →
          </button>


        </div>


        <div class="project-info">


          <div class="project-line"></div>


          <div class="project-title">
            PLACES INSPIRED BY ROBERT SMITHSON
          </div>


          <div class="project-description">
            <!-- Description to be added -->
          </div>


        </div>


      </article>



      <!-- =====================================

           ===================================== -->

      <article
        class="project project-vetcard"
      >


        <div
          class="image-area"
          onclick="nextImage(2)"
        >


          <button
            class="arrow arrow-left"
            type="button"
            onclick="event.stopPropagation(); previousImage(2)"
            aria-label="Previous image"
          >
            ←
          </button>


          <img
            id="image-2"
            class="project-image"
            src="VetCard_1.jpg"
            alt="VetCard"
          >


          <button
            class="arrow arrow-right"
            type="button"
            onclick="event.stopPropagation(); nextImage(2)"
            aria-label="Next image"
          >
            →
          </button>


        </div>


        <div class="project-info">


          <div class="project-line"></div>


          <div class="project-title">
            VETCARD
          </div>


          <div class="project-description">
            <!-- Description to be added -->
          </div>


        </div>


      </article>



      <!-- =====================================
           URBAN DESIGN
           ===================================== -->

      <article
        class="project project-urban"
      >


        <div
          class="image-area"
          onclick="nextImage(3)"
        >


          <button
            class="arrow arrow-left"
            type="button"
            onclick="event.stopPropagation(); previousImage(3)"
            aria-label="Previous image"
          >
            ←
          </button>


          <img
            id="image-3"
            class="project-image"
            src="Urban_1.png"
            alt="Urban Design"
          >


          <button
            class="arrow arrow-right"
            type="button"
            onclick="event.stopPropagation(); nextImage(3)"
            aria-label="Next image"
          >
            →
          </button>


        </div>


        <div class="project-info">


          <div class="project-line"></div>


          <div class="project-title">
            URBAN DESIGN
          </div>


          <div class="project-description">
            <!-- Description to be added -->
          </div>


        </div>


      </article>


    </section>


  </main>



  <!-- =========================================
       WEBSITE CREDIT
       ========================================= -->

  <div class="website-credit">

    WEB DESIGN: MYRTO PAVLOPOULOU

  </div>



  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>


    const projects = [


      /* ECHOES OF THE DEEP */

      [
        "Jelly_1.jpg",
        "Jelly_2.JPG",
        "Jelly_3.JPG",
        "Jelly_4.jpg",
        "Jelly_5.JPG",
        "Jelly_6.jpg",
        "Jelly_7.JPG",
        "Jelly_8.JPG"
      ],


      /* ROBERT SMITHSON */

      [
        "Smithson_1.png",
        "Smithson_2.jpg",
        "Smithson_3.png",
        "Smithson_4.png",
        "Smithson_5.jpg",
        "Smithson_6.jpg",
        "Smithson_7.jpg",
        "Smithson_8.jpg",
        "Smithson_9.png",
        "Smithson_10.png"
      ],


      /* VETCARD */

      [
        "VetCard_1.jpg",
        "VetCard2.jpg"
      ],


      /* URBAN DESIGN */

      [
        "Urban_1.png",
        "Urban_2.jpg",
        "Urban_3.jpg"
      ]

    ];


    const currentImages = [
      0,
      0,
      0,
      0
    ];



    function updateImage(projectIndex) {


      const image =
        document.getElementById(
          "image-" + projectIndex
        );


      image.style.opacity = "0.4";


      setTimeout(function () {


        image.src =
          projects[projectIndex][
            currentImages[projectIndex]
          ];


        image.onload = function () {

          image.style.opacity = "1";

        };


      }, 100);

    }



    function nextImage(projectIndex) {


      currentImages[projectIndex]++;


      if (
        currentImages[projectIndex] >=
        projects[projectIndex].length
      ) {

        currentImages[projectIndex] = 0;

      }


      updateImage(projectIndex);

    }



    function previousImage(projectIndex) {


      currentImages[projectIndex]--;


      if (
        currentImages[projectIndex] < 0
      ) {

        currentImages[projectIndex] =
          projects[projectIndex].length - 1;

      }


      updateImage(projectIndex);

    }


  </script>


</body>

</html>
