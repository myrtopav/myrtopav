<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gallery — Myrto Pavlopoulou</title>

  <link
    rel="icon"
    type="image/jpeg"
    href="profile.jpg"
  >


  <style>

    /* =========================================
       BASIC
       ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {

      background: #ffffff;

      color: #000000;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 10px;

      font-weight: 400;

      cursor:
        url("cursor2.png") 25 25,
        auto;
    }

    a {

      text-decoration: none;

      cursor:
        url("cursor2.png") 25 25,
        auto;
    }


    /* =========================================
       HEADER
       ========================================= */

    header {

      position: relative;

      height: 15vh;

      min-height: 90px;

      padding:
        30px
        3vw
        0
        3vw;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      align-items: start;

      font-size: 10px;

      text-transform: uppercase;

      z-index: 100;
    }


    .name {

      text-align: left;
    }


    .name a {

      color: #777777;

      font-size: 10px;

      transition:
        color 0.2s ease;
    }


    .name a:hover {

      color: #2f6fff;
    }


    .profession {

      text-align: right;

      color: #777777;
    }


    /* =========================================
       NAVIGATION
       ========================================= */

    .navigation {

      position: absolute;

      left: 3vw;

      bottom: 0;

      display: flex;

      gap: 25px;

      font-size: 10px;

      text-transform: uppercase;
    }


    .navigation a {

      color: #777777;

      font-size: 10px;

      transition:
        color 0.2s ease;
    }


    .navigation a:hover {

      color: #2f6fff;
    }


    /* =========================================
       EDITORIAL GALLERY
       ========================================= */

    main {

      width: 100%;

      padding:
        5vh
        3vw
        120px
        3vw;
    }


    .gallery {

      position: relative;

      width: 100%;

      min-height: 150vh;
    }


    /* =========================================
       PROJECT
       ========================================= */

    .project {

      position: absolute;

      text-align: center;

      z-index: 1;

      transition:
        transform 0.45s
        cubic-bezier(
          0.2,
          0.7,
          0.2,
          1
        );
    }


    /*
      Selected project comes to the front.
    */

    .project.selected {

      z-index: 50;
    }


    /* =========================================
       PROJECT POSITIONS / SIZES
       ========================================= */


    /*
      ECHOES OF THE DEEP
    */

    .project-jelly {

      width: 23vw;

      left: 2vw;

      top: 1vh;
    }


    /*
      ROBERT SMITHSON
    */

    .project-smithson {

      width: 27vw;

      right: 4vw;

      top: 0;
    }


    /*
      VETCARD
    */

    .project-vetcard {

      width: 20vw;

      left: 28vw;

      top: 39vh;
    }


    /*
      URBAN DESIGN
    */

    .project-urban {

      width: 23vw;

      right: 17vw;

      top: 45vh;
    }


    /*
      YTONG MODEL
    */

    .project-ytong {

      width: 19vw;

      left: 7vw;

      top: 77vh;
    }


    /* =========================================
       IMAGE AREA
       ========================================= */

    .image-area {

      position: relative;

      width: 100%;

      margin: 0 auto;

      overflow: visible;

      cursor:
        url("cursor2.png") 25 25,
        pointer;
    }


    .project-image {

      display: block;

      width: 100%;

      height: auto;

      object-fit: contain;

      transition:
        transform 0.5s
        cubic-bezier(
          0.2,
          0.7,
          0.2,
          1
        ),

        opacity 0.4s ease;
    }


    /* =========================================
       NORMAL HOVER
       ========================================= */

    .project:hover .project-image {

      transform:
        scale(1.045);

      opacity: 0.92;
    }


    /* =========================================
       SELECTED IMAGE
       ========================================= */

    .project.selected .project-image {

      transform:
        scale(1.075);

      opacity: 1;
    }


    /* =========================================
       ARROWS
       ========================================= */

    .arrow {

      position: absolute;

      top: 50%;

      transform:
        translateY(-50%);

      z-index: 10;

      border: none;

      outline: none;

      padding: 0;

      background: transparent;

      color: #777777;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 17px;

      line-height: 1;

      cursor:
        url("cursor2.png") 25 25,
        auto;

      opacity: 0;

      transition:
        opacity 0.25s ease,
        color 0.2s ease;
    }


    .arrow-left {

      left: 10px;
    }


    .arrow-right {

      right: 10px;
    }


    .project:hover .arrow {

      opacity: 1;
    }


    .project.selected .arrow {

      opacity: 1;
    }


    .arrow:hover {

      color: #2f6fff;
    }


    /* =========================================
       PROJECT INFORMATION
       ========================================= */

    .project-info {

      display: flex;

      flex-direction: column;

      align-items: center;

      margin-top: 12px;

      padding:
        0
        8px;

      opacity: 0;

      transform:
        translateY(-5px);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease,
        background 0.25s ease,
        padding 0.25s ease;

      pointer-events: none;
    }


    /*
      Information appears on hover.
    */

    .project:hover .project-info {

      opacity: 1;

      transform:
        translateY(0);
    }


    /*
      Selected project gets
      a blue information box.
    */

    .project.selected .project-info {

      opacity: 1;

      transform:
        translateY(0);

      pointer-events: auto;

      background: #2f6fff;

      padding:
        9px
        13px
        11px
        13px;
    }


    /* =========================================
       BLUE LINE
       ========================================= */

    .project-line {

      width: 22px;

      height: 1px;

      background: #2f6fff;

      margin-bottom: 8px;
    }


    /*
      White line when selected.
    */

    .project.selected .project-line {

      background: #ffffff;
    }


    /* =========================================
       TITLE
       ========================================= */

    .project-title {

      color: #2f6fff;

      font-size: 10px;

      line-height: 1.35;

      text-transform: uppercase;
    }


    /*
      White title on blue background.
    */

    .project.selected .project-title {

      color: #ffffff;
    }


    /* =========================================
       DESCRIPTION
       ========================================= */

    .project-description {

      max-width: 280px;

      margin-top: 7px;

      color: #777777;

      font-size: 9px;

      line-height: 1.5;

      text-transform: none;
    }


    /*
      Description becomes white
      when project is selected.
    */

    .project.selected .project-description {

      color: #ffffff;
    }


    .black-text {

      color: #000000;
    }


    .project.selected .black-text {

      color: #ffffff;
    }


    .project-description a {

      color: #777777;

      text-decoration: none;

      transition:
        color 0.2s ease;
    }


    .project-description a:hover {

      color: #2f6fff;
    }


    .project.selected .project-description a {

      color: #ffffff;
    }


    .project.selected .project-description a:hover {

      color: #dce7ff;
    }


    .location {

      display: block;

      margin-top: 1px;
    }


    /* =========================================
       WEBSITE CREDIT
       ========================================= */

    .website-credit {

      position: fixed;

      right: 3vw;

      bottom: 25px;

      color: #777777;

      font-size: 10px;

      font-weight: 400;

      text-align: right;

      z-index: 100;
    }


    /* =========================================
       TABLET
       ========================================= */

    @media (max-width: 900px) {

      header {

        padding-left: 5vw;

        padding-right: 5vw;
      }


      .navigation {

        left: 5vw;
      }


      main {

        padding-left: 5vw;

        padding-right: 5vw;
      }


      .gallery {

        min-height: 135vh;
      }


      .project-jelly {

        width: 25vw;

        left: 0;

        top: 2vh;
      }


      .project-smithson {

        width: 30vw;

        right: 2vw;

        top: 0;
      }


      .project-vetcard {

        width: 22vw;

        left: 25vw;

        top: 40vh;
      }


      .project-urban {

        width: 25vw;

        right: 12vw;

        top: 46vh;
      }


      .project-ytong {

        width: 21vw;

        left: 5vw;

        top: 76vh;
      }

    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 650px) {

      html,
      body {

        height: auto;
      }


      header {

        height: auto;

        padding:
          24px
          5vw
          0
          5vw;
      }


      .navigation {

        position: static;

        margin-top: 45px;

        gap: 20px;
      }


      main {

        padding:
          65px
          7vw
          100px
          7vw;
      }


      .gallery {

        min-height: auto;

        display: flex;

        flex-direction: column;

        gap: 65px;
      }


      .project {

        position: relative;

        width: 72% !important;

        left: auto !important;

        right: auto !important;

        top: auto !important;

        margin: 0 auto;
      }


      .project:nth-child(2) {

        width: 80% !important;

        margin-left: 12%;
      }


      .project:nth-child(3) {

        width: 60% !important;

        margin-left: 5%;
      }


      .project:nth-child(4) {

        width: 70% !important;

        margin-right: 5%;
      }


      .project:nth-child(5) {

        width: 58% !important;

        margin-left: 8%;
      }


      /*
        Information remains visible
        on mobile.
      */

      .project-info {

        opacity: 1;

        transform:
          translateY(0);

        pointer-events: auto;
      }


      .arrow {

        opacity: 1;

        font-size: 16px;
      }


      .project.selected .project-image {

        transform:
          scale(1.045);
      }


      .website-credit {

        right: 5vw;

        bottom: 20px;
      }

    }


    /* =========================================
       SMALL MOBILE
       ========================================= */

    @media (max-width: 450px) {

      main {

        padding-left: 8vw;

        padding-right: 8vw;
      }


      .gallery {

        gap: 55px;
      }


      .project {

        width: 74% !important;
      }


      .project:nth-child(2) {

        width: 84% !important;

        margin-left: 7%;
      }


      .project:nth-child(3) {

        width: 63% !important;

        margin-left: 2%;
      }


      .project:nth-child(4) {

        width: 72% !important;

        margin-right: 2%;
      }


      .project:nth-child(5) {

        width: 61% !important;

        margin-left: 5%;
      }


      .project-description {

        font-size: 9px;
      }


      .website-credit {

        font-size: 9px;
      }

    }

  </style>

</head>


<body>

  <!-- =========================================

  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>


    const projects = [


      /* ECHOES OF THE DEEP */

      [
        "Jelly_1.jpg",
        "Jelly_2.JPG",
        "Jelly_3.JPG",
        "Jelly_4.jpg",
        "Jelly_5.JPG",
        "Jelly_6.jpg",
        "Jelly_7.JPG",
        "Jelly_8.JPG"
      ],


      /* ROBERT SMITHSON */

      [
        "Smithson_1.png",
        "Smithson_2.jpg",
        "Smithson_3.png",
        "Smithson_4.png",
        "Smithson_5.jpg",
        "Smithson_6.jpg",
        "Smithson_7.jpg",
        "Smithson_8.jpg",
        "Smithson_9.png",
        "Smithson_10.png"
      ],


      /* VETCARD */

      [
        "VetCard_1.jpg",
        "VetCard2.jpg"
      ],


      /* URBAN DESIGN */

      [
        "Urban_1.png",
        "Urban_2.jpg",
        "Urban_3.jpg"
      ],


      /* YTONG MODEL */

      [
        "model_1.jpg",
        "model_1(2).jpg",
        "model_1(3).jpg"
      ]

    ];


    const currentImages = [
      0,
      0,
      0,
      0,
      0
    ];



    /* =========================================
       SELECT PROJECT
       ========================================= */

    function selectProject(projectIndex) {


      const allProjects =
        document.querySelectorAll(
          ".project"
        );


      allProjects.forEach(function(project) {

        project.classList.remove(
          "selected"
        );

      });


      const selectedProject =
        document.getElementById(
          "project-" + projectIndex
        );


      selectedProject.classList.add(
        "selected"
      );

    }



    /* =========================================
       CLICK IMAGE
       ========================================= */

    function selectAndNext(projectIndex) {


      selectProject(projectIndex);


      nextImage(projectIndex);

    }



    /* =========================================
       UPDATE IMAGE
       ========================================= */

    function updateImage(projectIndex) {


      const image =
        document.getElementById(
          "image-" + projectIndex
        );


      image.style.opacity = "0.4";


      setTimeout(function() {


        image.src =
          projects[projectIndex][
            currentImages[projectIndex]
          ];


        image.onload = function() {

          image.style.opacity = "1";

        };


      }, 100);

    }



    /* =========================================
       NEXT IMAGE
       ========================================= */

    function nextImage(projectIndex) {


      currentImages[projectIndex]++;


      if (
        currentImages[projectIndex] >=
        projects[projectIndex].length
      ) {

        currentImages[projectIndex] = 0;

      }


      updateImage(projectIndex);

    }



    /* =========================================
       PREVIOUS IMAGE
       ========================================= */

    function previousImage(projectIndex) {


      currentImages[projectIndex]--;


      if (
        currentImages[projectIndex] < 0
      ) {

        currentImages[projectIndex] =
          projects[projectIndex].length - 1;

      }


      updateImage(projectIndex);

    }


  </script>
