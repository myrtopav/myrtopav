<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gallery — Myrto Pavlopoulou</title>

  <link rel="icon" type="image/jpeg" href="profile.jpg">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #f2f6ff;
      color: #000000;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 400;

      cursor: url("cursor2.png") 25 25, auto;
    }

    a {
      text-decoration: none;
      cursor: url("cursor2.png") 25 25, auto;
    }


    /* =========================
       HEADER
       ========================= */

    header {
      position: relative;

      height: 15vh;
      min-height: 90px;

      padding: 30px 3vw 0 3vw;

      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;

      font-size: 10px;
      text-transform: uppercase;
    }

    .name {
      text-align: left;
    }

    .name a {
      color: #777777;
      font-size: 10px;

      transition: color 0.2s ease;
    }

    .name a:hover {
      color: #2f6fff;
    }

    .profession {
      text-align: right;
      color: #777777;
    }


    /* =========================
       NAVIGATION
       ========================= */

    .navigation {
      position: absolute;

      left: 3vw;
      bottom: 0;

      display: flex;
      gap: 25px;

      font-size: 10px;
      text-transform: uppercase;
    }

    .navigation a {
      color: #777777;
      font-size: 10px;

      transition: color 0.2s ease;
    }

    .navigation a:hover {
      color: #2f6fff;
    }


    /* =========================
       GALLERY
       ========================= */

    main {
      width: 100%;

      padding: 7vh 6vw 110px 6vw;
    }

    .gallery-grid {
      width: 100%;

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      column-gap: 5vw;
      row-gap: 7vh;

      align-items: start;
    }


    /* =========================
       PROJECT
       ========================= */

    .project {
      width: 100%;

      text-align: center;
    }


    /* =========================
       IMAGE AREA
       ========================= */

    .image-area {
      position: relative;

      width: 72%;

      margin: 0 auto;

      overflow: visible;
    }

    .project-image {
      display: block;

      width: 100%;
      height: auto;

      object-fit: contain;

      transition:
        transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1),
        opacity 0.45s ease;
    }

    .project:hover .project-image {
      transform: scale(1.035);
      opacity: 0.92;
    }


    /* =========================
       ARROWS
       ========================= */

    .arrow {
      position: absolute;

      top: 50%;

      transform: translateY(-50%);

      width: 32px;
      height: 44px;

      border: none;

      background: rgba(242, 246, 255, 0.45);

      color: #777777;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: 400;

      cursor: url("cursor2.png") 25 25, auto;

      z-index: 5;

      opacity: 0;

      transition:
        opacity 0.25s ease,
        color 0.2s ease,
        background 0.2s ease;
    }

    .arrow-left {
      left: 0;
    }

    .arrow-right {
      right: 0;
    }

    .project:hover .arrow {
      opacity: 1;
    }

    .arrow:hover {
      color: #2f6fff;

      background: rgba(242, 246, 255, 0.75);
    }


    /* =========================
       PROJECT INFORMATION
       ========================= */

    .project-info {
      display: flex;

      flex-direction: column;
      align-items: center;

      margin-top: 15px;
    }

    .project-line {
      width: 22px;
      height: 1px;

      background: #2f6fff;

      margin-bottom: 8px;
    }

    .project-title {
      color: #2f6fff;

      font-size: 10px;
      line-height: 1.35;

      text-transform: uppercase;
    }

    .project-description {
      max-width: 280px;

      margin-top: 7px;

      color: #777777;

      font-size: 9px;
      line-height: 1.5;

      text-transform: none;
    }

    .project-description .black-text {
      color: #000000;
    }

    .project-description a {
      color: #777777;

      text-decoration: none;

      transition: color 0.2s ease;
    }

    .project-description a:hover {
      color: #2f6fff;
    }

    .location {
      display: block;

      margin-top: 1px;
    }


    /* =========================
       WEBSITE CREDIT
       ========================= */

    .website-credit {
      position: fixed;

      right: 3vw;
      bottom: 25px;

      color: #777777;

      font-size: 10px;
      font-weight: 400;

      text-align: right;
    }


    /* =========================
       TABLET
       ========================= */

    @media (max-width: 900px) {

      header {
        padding-left: 5vw;
        padding-right: 5vw;
      }

      .navigation {
        left: 5vw;
      }

      main {
        padding-left: 6vw;
        padding-right: 6vw;
      }

      .gallery-grid {
        column-gap: 4vw;
        row-gap: 6vh;
      }

      .image-area {
        width: 78%;
      }

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 650px) {

      html,
      body {
        height: auto;
      }

      header {
        height: auto;

        padding: 24px 5vw 0 5vw;
      }

      .navigation {
        position: static;

        margin-top: 45px;

        gap: 20px;
      }

      main {
        padding: 65px 8vw 100px 8vw;
      }

      .gallery-grid {
        grid-template-columns: 1fr;

        row-gap: 60px;
      }

      .image-area {
        width: 68%;
      }

      .project-info {
        margin-top: 14px;
      }

      .project-description {
        max-width: 280px;
      }

      .arrow {
        opacity: 1;

        width: 34px;
        height: 46px;

        background: rgba(242, 246, 255, 0.35);
      }

      .arrow-left {
        left: 0;
      }

      .arrow-right {
        right: 0;
      }

      .website-credit {
        right: 5vw;
        bottom: 20px;
      }

    }


    /* =========================
       SMALL MOBILE
       ========================= */

    @media (max-width: 450px) {

      main {
        padding-left: 9vw;
        padding-right: 9vw;
      }

      .image-area {
        width: 72%;
      }

      .project-description {
        font-size: 9px;
      }

      .website-credit {
        font-size: 9px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
       ========================= -->

  <header>

    <div class="name">
      <a href="index.html">
        MYRTO PAVLOPOULOU
      </a>
    </div>

    <div class="profession">
      ARCHITECT
    </div>

    <nav class="navigation">

      <a href="about.html">
        ABOUT
      </a>

      <a href="contact.html">
        CONTACT
      </a>

    </nav>

  </header>



  <!-- =========================
       GALLERY
       ========================= -->

  <main>

    <section class="gallery-grid">


      <!-- =========================
           ECHOES OF THE DEEP
           ========================= -->

      <article class="project">

        <div class="image-area">

          <button
            class="arrow arrow-left"
            type="button"
            onclick="previousImage(0)"
            aria-label="Previous image"
          >
            ←
          </button>

          <img
            id="image-0"
            class="project-image"
            src="Jelly_1.jpg"
            alt="Echoes of the Deep"
          >

          <button
            class="arrow arrow-right"
            type="button"
            onclick="nextImage(0)"
            aria-label="Next image"
          >
            →
          </button>

        </div>


        <div class="project-info">

          <div class="project-line"></div>

          <div class="project-title">
            ECHOES OF THE DEEP
          </div>

          <div class="project-description">

            an interactive
            <span class="black-text">
              light and sound installation
            </span>
            for Mar Motto festival’s 2025 edition
            with

            <a
              href="https://moradavaga.com/ECHOES-OF-THE-DEEP"
              target="_blank"
              rel="noopener noreferrer"
            >
              MORADAVAGA
            </a>

            <span class="location">
              Faro, Portugal
            </span>

          </div>

        </div>

      </article>



      <!-- =========================
           ROBERT SMITHSON
           ========================= -->

      <article class="project">

        <div class="image-area">

          <button
            class="arrow arrow-left"
            type="button"
            onclick="previousImage(1)"
            aria-label="Previous image"
          >
            ←
          </button>

          <img
            id="image-1"
            class="project-image"
            src="Smithson_1.png"
            alt="Places inspired by Robert Smithson"
          >

          <button
            class="arrow arrow-right"
            type="button"
            onclick="nextImage(1)"
            aria-label="Next image"
          >
            →
          </button>

        </div>


        <div class="project-info">

          <div class="project-line"></div>

          <div class="project-title">
            PLACES INSPIRED BY ROBERT SMITHSON
          </div>

          <div class="project-description">
            <!-- Description to be added -->
          </div>

        </div>

      </article>



      <!-- =========================
           VETCARD
           ========================= -->

      <article class="project">

        <div class="image-area">

          <button
            class="arrow arrow-left"
            type="button"
            onclick="previousImage(2)"
            aria-label="Previous image"
          >
            ←
          </button>

          <img
            id="image-2"
            class="project-image"
            src="VetCard_1.jpg"
            alt="VetCard"
          >

          <button
            class="arrow arrow-right"
            type="button"
            onclick="nextImage(2)"
            aria-label="Next image"
          >
            →
          </button>

        </div>


        <div class="project-info">

          <div class="project-line"></div>

          <div class="project-title">
            VETCARD
          </div>

          <div class="project-description">
            <!-- Description to be added -->
          </div>

        </div>

      </article>


    </section>

  </main>



  <!-- =========================
       WEBSITE CREDIT
       ========================= -->

  <div class="website-credit">
    WEB DESIGN: MYRTO PAVLOPOULOU
  </div>



  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    const projects = [

      [
        "Jelly_1.jpg",
        "Jelly_2.JPG",
        "Jelly_3.JPG",
        "Jelly_4.jpg",
        "Jelly_5.JPG",
        "Jelly_6.jpg",
        "Jelly_7.JPG",
        "Jelly_8.JPG"
      ],

      [
        "Smithson_1.png",
        "Smithson_2.jpg",
        "Smithson_3.png",
        "Smithson_4.png",
        "Smithson_5.jpg",
        "Smithson_6.jpg",
        "Smithson_7.jpg",
        "Smithson_8.jpg",
        "Smithson_9.png",
        "Smithson_10.png"
      ],

      [
        "VetCard_1.jpg",
        "VetCard2.jpg"
      ]

    ];


    const currentImages = [
      0,
      0,
      0
    ];


    function showImage(projectIndex) {

      const image =
        document.getElementById("image-" + projectIndex);

      image.src =
        projects[projectIndex][currentImages[projectIndex]];

    }


    function nextImage(projectIndex) {

      currentImages[projectIndex]++;

      if (
        currentImages[projectIndex] >=
        projects[projectIndex].length
      ) {

        currentImages[projectIndex] = 0;

      }

      showImage(projectIndex);

    }


    function previousImage(projectIndex) {

      currentImages[projectIndex]--;

      if (
        currentImages[projectIndex] < 0
      ) {

        currentImages[projectIndex] =
          projects[projectIndex].length - 1;

      }

      showImage(projectIndex);

    }

  </script>


</body>

</html>
